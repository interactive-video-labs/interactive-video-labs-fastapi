name: Tag and Release After Merge

permissions:
  contents: write

on:
  push:
    branches:
      - main

jobs:
  create-tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Get package version
        id: package
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          with pathlib.Path("pyproject.toml").open("rb") as pyproject:
              project = tomllib.load(pyproject)

          version = project["tool"]["poetry"]["version"]
          print(f"Package version: {version}")
          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          PY

      - name: Check release type
        id: release
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import subprocess

          version = "${{ steps.package.outputs.version }}"

          def parts(value):
              match = re.fullmatch(r"v?(\d+)\.(\d+)\.(\d+)", value)
              return tuple(int(part) for part in match.groups()) if match else None

          tags = subprocess.run(
              ["git", "tag", "--list", "v*.*.*", "--sort=-v:refname"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          last_tag = next((tag for tag in tags if parts(tag) is not None), "v0.0.0")

          new = parts(version)
          old = parts(last_tag)
          if new is None:
              release_type = "none"
          elif new == old:
              release_type = "none"
          elif new <= old:
              release_type = "none"
          elif new[0] > old[0]:
              release_type = "major"
          elif new[1] > old[1]:
              release_type = "minor"
          else:
              release_type = "patch"

          tag_exists = subprocess.run(
              ["git", "rev-parse", "-q", "--verify", f"refs/tags/v{version}"],
              capture_output=True,
          ).returncode == 0

          should_release = release_type in {"major", "minor"} and not tag_exists
          print(f"Package version: {version}")
          print(f"Last tag: {last_tag}")
          print(f"Release type: {release_type}")

          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"release_type={release_type}\n")
              output.write(f"should_release={'true' if should_release else 'false'}\n")
          PY

      - name: Skip non-major or non-minor release
        if: steps.release.outputs.should_release != 'true'
        run: echo "No new major or minor release detected."

      - name: Extract release notes
        if: steps.release.outputs.should_release == 'true'
        id: changelog
        env:
          VERSION: ${{ steps.package.outputs.version }}
          RELEASE_TYPE: ${{ steps.release.outputs.release_type }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          version = os.environ["VERSION"]
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"^## \[v?{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)"
          match = re.search(pattern, changelog, flags=re.MULTILINE | re.DOTALL)
          notes = match.group(1).strip() if match else "No release notes found."

          heading = {
              "major": "## 🚀 Major Release",
              "minor": "## ✨ Minor Release",
          }.get(os.environ["RELEASE_TYPE"], "")
          if heading:
              notes = f"{heading}\n\n{notes}"

          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write("notes<<EOF\n")
              output.write(notes)
              output.write("\nEOF\n")
          PY

      - name: Create and push git tag
        if: steps.release.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub Release
        if: steps.release.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v3
        env:
          VERSION: ${{ steps.package.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          body: ${{ steps.changelog.outputs.notes }}